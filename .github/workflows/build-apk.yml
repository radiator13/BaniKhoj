name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain for native core
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Select Android NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Fetch pre-compressed Shabad OS database (not stored in repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/databases
          gh release download -R radiator13/shabados \
            --pattern "master.sqlite.xz" \
            --output app/src/main/assets/databases/master.sqlite.xz \
            --clobber
          ls -lh app/src/main/assets/databases/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build signed release APK (arm64-v8a)
        run: |
          gradle :app:assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/release

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BaniKhoj-release-opt-arm64.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: banikhoj-apks
          path: BaniKhoj-release-opt-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "BaniKhoj-release-opt-arm64.apk#BaniKhoj-release-optimized R8+XZ (arm64)" \
            --title "BaniKhoj $TAG" \
            --notes "Kotlin + Jetpack Compose M3 on Shabad OS SQLite, native Rust core (JNI): XZ extraction + in-memory memmem search. arm64-v8a only. Release build: R8 minified, resources shrunk, DB shipped XZ-compressed in APK (~158MB → ~45MB), decompressed once on first launch then plain SQLite on disk — zero runtime overhead." \
            --latest
