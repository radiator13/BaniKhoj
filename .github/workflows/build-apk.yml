name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch Shabad OS database (not stored in repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/databases
          gh release download -R radiator13/shabados \
            --pattern "master.sqlite" \
            --output app/src/main/assets/databases/master.sqlite \
            --clobber
          ls -lh app/src/main/assets/databases/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: banikhoj-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#BaniKhoj-debug.apk" \
            --title "BaniKhoj $TAG" \
            --notes "Kotlin + Jetpack Compose (Material 3) Gurbani app bundling the latest Shabad OS master.sqlite. Debug-signed APK." \
            --latest
