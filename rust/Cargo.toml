[package]
name = "gurbanidb"
version = "0.1.0"
edition = "2021"

[lib]
name = "gurbanidb"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
memchr = "2"
xz2 = { version = "0.1", features = ["static"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
